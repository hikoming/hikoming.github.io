<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Dev Enthusiast</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Inter', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      text-align: center;
      max-width: 600px;
      padding: 3rem 2rem;
    }

    .emoji {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    .sub {
      font-size: 1.2rem;
      color: #475569;
      margin-bottom: 2rem;
      border-bottom: 2px solid #e2e8f0;
      display: inline-block;
      padding-bottom: 0.25rem;
    }

    .heart {
      color: #ef4444;
    }

    .note {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #cbd5e1;
      margin: 1.5rem auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📱💻</div>
    <h1>App Dev Enthusiast</h1>
    <div class="sub">passionate about building</div>
    <div class="divider"></div>
    <div class="note">
      <span>✨ space under construction ✨</span><br>
      <span style="font-size: 0.8rem;">more coming soon...</span>
    </div>
  </div>
</body>
</html>
